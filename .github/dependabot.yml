version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    versioning-strategy: increase
    cooldown:
      default-days: 3

  - package-ecosystem: npm
    directory: /apps/frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    versioning-strategy: increase
    cooldown:
      default-days: 3
    groups:
      react-version-updates:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
      react-security-updates:
        applies-to: security-updates
        patterns:
          - react
          - react-dom
      vite-version-updates:
        applies-to: version-updates
        patterns:
          - vite
          - "@vitejs/plugin-react"
      vite-security-updates:
        applies-to: security-updates
        patterns:
          - vite
          - "@vitejs/plugin-react"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
