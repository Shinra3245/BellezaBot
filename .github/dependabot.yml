version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    versioning-strategy: increase
    cooldown:
      default-days: 3

  - package-ecosystem: npm
    directory: /apps/frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    versioning-strategy: increase
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
